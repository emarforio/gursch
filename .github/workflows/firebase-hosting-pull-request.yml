# Builds every pull request and deploys it to a temporary preview URL, posted as a comment on the pull request.
name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    # Pull requests from forks cannot read the deploy secret, so they are skipped.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check that the Firebase web config is committed
        run: test -f .env || { echo "::error::.env is missing, so the build would have no sign-in or sync. Copy .env.local to .env and commit it."; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GURSCH_C01A0 }}
          projectId: gursch-c01a0
